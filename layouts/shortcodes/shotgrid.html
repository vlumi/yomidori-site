{{- /* Wraps a set of {{< shot >}} calls in a responsive grid. An optional
       first argument adds a modifier class, e.g. {{< shotgrid "wide" >}} for
       landscape (Mac) shots that want wider columns so they aren't squeezed to
       portrait width. */ -}}
{{- $variant := .Get 0 -}}
<div class="shot-grid{{ with $variant }} shot-grid--{{ . }}{{ end }}">
  {{ .Inner }}
</div>
