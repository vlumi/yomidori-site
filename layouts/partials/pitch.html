       high mora, the line falling where the accent does. よみどり is [2]: low, high,
       then the drop. */ -}}
<span class="pitch" aria-label="よみどり, accent on the second mora"><span class="mora">よ</span><span class="mora hi drop">み</span><span class="mora">ど</span><span class="mora">り</span><span class="num">[2]</span></span>
